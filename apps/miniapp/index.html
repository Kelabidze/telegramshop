<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!--
      `viewport-fit=cover` plus `user-scalable=no` prevents the zoom-on-input
      and rubber-band scrolling that make a Mini App feel non-native.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!--
      The brand background, declared before the stylesheet is fetched. The app is
      permanently dark, so without this the WebView paints its default white for
      one frame on a cold start — the single most visible way a Mini App gives
      away that it is a web page.

      `color-scheme: dark` here (not only via the WebApp API) is what makes the
      browser render native controls, form autofill and scrollbars dark from the
      very first paint.
    -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#08070C" />
    <style>
      html {
        background: #08070c;
        color-scheme: dark;
      }
    </style>
    <!--
      The mark lives in `public/`, which Vite copies to the root of `dist`, so this
      URL is fixed and needs no build-time interpolation.

      SVG only. `apple-touch-icon` wants a PNG at a specific pixel size, and there is
      no PNG export of the mark in the pack — a <link> to a file that does not exist
      is a 404 on every cold start, which is worse than letting iOS fall back to a
      screenshot of the page.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>OCHKISK ZONE</title>
    <!--
      The Telegram WebApp script must load before the app so `window.Telegram`
      exists on first render. It is intentionally NOT bundled: Telegram serves
      the version matching the client.
    -->
    <script src="https://telegram.org/js/telegram-web-app.js?58"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
