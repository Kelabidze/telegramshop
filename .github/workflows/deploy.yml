name: Deploy

on:
  push:
    branches: [main]
  # Allows a manual redeploy from the Actions tab without a new commit.
  workflow_dispatch:

# A newer push supersedes an in-flight deploy, but never cancels one midway
# through the server-side switch.
concurrency:
  group: deploy-production
  cancel-in-progress: false

# The Node major must match the server: compiled output and native modules are
# both tied to it. setup-server.sh installs this same major.
env:
  NODE_VERSION: '22'

jobs:
  # All heavy work happens here, on a free 4-core runner, so the VPS never
  # compiles anything. The server is only touched if the code is sound.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # npm 11 blocks install scripts unless allow-listed. The repo's
      # package.json pins the approvals, so the native SQLite module installs.
      - name: Install dependencies
        run: npm ci

      # The Prisma SQLite adapter resolves its own nested better-sqlite3.
      # Probe through the adapter, which is what the app actually loads.
      - name: Verify the SQLite driver loaded
        run: node -e "import('@prisma/adapter-better-sqlite3').then(()=>console.log('SQLite adapter OK'))"

      - name: Generate Prisma client
        run: npm run db:generate -w @shop/api

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Compiled output + manifests only, ~0.2 MB gzipped. No node_modules:
      # the server installs those itself so native binaries match its Node ABI.
      - name: Pack artifact
        run: npm run pack

      - uses: actions/upload-artifact@v4
        with:
          name: shop-release-${{ github.sha }}
          path: |
            build/artifact.tar.gz
            build/artifact.tar.gz.sha256
          retention-days: 14
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: shop-release-${{ github.sha }}
          path: build

      - name: Show what is being shipped
        run: ls -lh build/ && cat build/artifact.tar.gz.sha256

      # Upload before running anything: a failed transfer must not restart the
      # service or touch the live release.
      - name: Upload artifact to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: 'build/artifact.tar.gz,build/artifact.tar.gz.sha256'
          target: /srv/shop/incoming
          strip_components: 1
          overwrite: true

      - name: Install the release
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          # No compilation on the server, but `npm ci --omit=dev` on a slow disk
          # still needs room.
          command_timeout: 10m
          script_stop: true
          script: |
            set -euo pipefail

            # Sync the deploy scripts to the commit being deployed. Application
            # code arrives as an artifact, but deploy.sh, the Caddyfile and the
            # systemd unit still live in git — without this the server would keep
            # running an outdated deploy script.
            git config --global --get-all safe.directory | grep -qxF /srv/shop/repo \
              || git config --global --add safe.directory /srv/shop/repo
            git -C /srv/shop/repo fetch --quiet --prune origin
            git -C /srv/shop/repo checkout --quiet --detach ${{ github.sha }}

            bash /srv/shop/repo/deploy/deploy.sh /srv/shop/incoming/artifact.tar.gz

      - name: Verify the site is live
        run: |
          set -euo pipefail
          url="https://${{ secrets.DOMAIN }}/health"
          echo "Checking $url"
          for i in $(seq 1 10); do
            if body=$(curl -fsS --max-time 10 "$url"); then
              echo "$body"
              echo "$body" | grep -q '"ok":true' && exit 0
            fi
            sleep 3
          done
          echo "Public health check failed" >&2
          exit 1
